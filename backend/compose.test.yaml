name: delivery-backend-test
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: delivery_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d delivery_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test-api:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://test:test@test-db:5432/delivery_test
    depends_on:
      test-db:
        condition: service_healthy
